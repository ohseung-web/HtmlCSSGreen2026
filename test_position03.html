<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보이고 / 감추기</title>
    <style>
        .parent div{
            /* border: 1px solid red; */
            width: 200px;
            height: 300px;
            float: left;
            margin: 10px;
        }
        .child1{
            background-color: dodgerblue;
            /* display: none; */
        }
        .child2{
            background-color: gold;
            /* visibility: hidden; */
        }
        .child3{
            background-color: lightgray;
            opacity: 0.5;
        }
        .parent02{
            position: relative;
            margin: 400px auto;
        }
        .parent02 div{
            width: 200px;
            height: 200px;
            position: absolute;
        }
        .child4{
            background-color: skyblue;
            margin: 10px;
        }
        .child5{
            background-color:blueviolet;
            margin: 20px;
            z-index: 100;
        }
        .child6{
            background-color:brown;
            margin: 30px;
            z-index: 20;
        }

    </style>
</head>
<body>
    <!-- 엘리먼트 보이고 / 감추는 속성
         1. display : none => 공간도 크기도 없고, 실제 존재하지 않는다.
         2. opacity : 0 => 공간과 크기는 유지하면서
                           화면에는 보이지 않고, 실재 존재한다.
         3. visibility : hidden => 공간과 크기 유지하면서, 
                                   화면 안보이고, 실재 존재하지 않는다.                    
    -->
    <div class="parent">
        <div class="child1"></div>
        <div class="child2"></div>
        <div class="child3"></div>
    </div>
    <hr/>
    <!-- Z-index : 반드시 포지션과 함께 사용해야 함
                   같은모양의 div가 겹쳐있을 경우
                   맨앞, 그 다음, 그 다음, 위치를 설정하는 속성 
                   z-index 숫자가 높을수로 위로 올라옴
                   단, z-index의 숫자를 1,2,3....(x)
                       z-index : 1000, 90
    -->
    <div class="parent02">
        <div class="child4"></div>
        <div class="child5"></div>
        <div class="child6"></div>
    </div>                   
</body>
</html>
