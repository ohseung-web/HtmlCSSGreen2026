<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 연습문제03</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #f2f3f2;
        }
        
        .sigin_box{
         margin: 40px auto;
         background-color: #ffffff;
         width: 400px;
         border-radius: 5px;
         padding: 40px;
       }
       .sigin_box form .form_group{
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
       }
       /* label 인라인 태그에 부모요소인 form_group에 display : flex를
          지정하므로 인라인 요소도 너비, 높이를 가질 수 있게 변함을 주의 하자.
       */
       .form_group label{
            width: 110px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
       }
    </style>
</head>
<body>
    <div class="sigin_box">
        <!-- form태그 이용  -->
         <form action="">
            <div class="form_group">
                <label for="name">이름</label>
                <input type="text" id="name" placeholder="홍길동">
            </div>
            <div class="form_group">
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>
            <div class="form_group">
                <label for="pw">비밀번호</label>
                <input type="password" id="pw">
            </div>
            <div class="form_group">
                <label for="pwcheck">비밀번호 확인</label>
                <input type="password" id="pwcheck">
            </div>
            <!-- 온라인 제출용 버튼 생성 -->
             <button type="submit" class="submit_btn">회원가입</button>
         </form>
    </div>
</body>
</html>
