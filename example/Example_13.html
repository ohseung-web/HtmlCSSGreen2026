<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제 04</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family: sans-serif;
            background-color: #f0f0f0;
            padding-top: 50px;
        }
        .menu{
            width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f5ecdf;
            margin: 0 auto;
        }
        h1{
            text-align: center;
            letter-spacing: 4px;
            font-size: 20px;
            margin-bottom: 10px;
        }

        ul{
            list-style: none;
        }
        li{
            padding: 10px 0;
            border-bottom: 1px dashed gray;
            font-size: 15px;
        }
        span{
            float: right;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Café Menu</h1>
        <ul>
            <li>AMERICANO <span>$3.50</span></li>
            <li>LATTE <span>$4.00</span></li>
            <li>CAPPUCCINO <span>$4.20</span></li>
        </ul>
    </div>
    <img src="/images/product1.jpg" alt="상품1이미지" />
</body>
</html>
