<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우지 header</title>
    <link rel="stylesheet" href="/styleCss/style_17.css">
</head>
<body>
   <!-- 시멘틱 태그란 HTML5에서 의미있는 머릿말,메뉴, 내용, 꼬리말 
        부분을 구분해놓은 태그이다.
        header(머릿말), nav(메뉴), section(주제별 내용), footer(꼬릿말) 
   -->
   <header class="site_header">
        <!-- Hader 부분의 로고 작성 부분 -->
        <div class="logo">
            <h1>OOZY COFFEE</h1>
        </div>
        <!-- 메뉴 부분 NAV태그 이용 -->
         <nav>
            <ul>
                <li>ABOUT US</li>
                <li>MENU</li>
                <li>STORE</li>
                <li>FRANCHISE</li>
                <li>COMMUNITY</li>
            </ul>
         </nav>
         <!-- 점주 부분 util  -->
         <div class="util">
            <span class="owner">점주님 공간</span>
            <button class="franchise_btn">프랜차이즈</button>
         </div> 
   </header>     
</body>
</html>
