<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 연습</title>
    <style>
        /* 부모인 container 공통 CSS => display:flex */
        .container{
            /* 부모요소가 아니라 container의 자식요소를 가로 배치한다. */
            display: flex;
            /* row(행) 기본 가로로 배치 */
            /* column(열) 기본 세로로 배치 */
            flex-direction:row;
            /* 부모의 가로 너비가 자식 요소전체의 너비 보다 작을때
               자동 개행 속성을 지정한다.
               flex-wrap : wrap(줄바꿈), nowrap(줄바꿈 안함)
            */
            flex-wrap: wrap;
            width: 500px;
            /* height: 400px; */
            /* height: 200px; */
            border: 1px solid blue;
            /* 자식요소를 부모요소의 가운데로 배치한다. */
            /* justify-content:center; */
            /* space-around 요소의 시작과 끝을 기준으로 공백 지정 */
            /* justify-content:space-around; */
            /* space-between는 요소와 요소사이의 공백을 일정하게 지정 */
            justify-content:space-between;
            /* space-evenly는 요소들 사이의 공백을 공평하게 지정 */
            /* justify-content:space-evenly; */
            margin: 0 auto;
        }
    
        .container .box{
            width: 100px;
            height: 100px;
            /* border: 1px solid red; */
            background-color: crimson;
            border-radius: 5px;
            margin: 5px;
            color:white;
        }
    </style>
</head>
<body>
    <!-- 
    
    -->
    <div class="container">
        <div class="box">box1</div>
        <!-- <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
        <div class="box">box6</div>
        <div class="box">box7</div> -->
        <div class="box">box8</div>
    </div>
   
</body>
</html>
